# Judgium takes contributions under the Developer Certificate of Origin rather
# than a CLA: contributors keep their copyright and licence it under AGPL-3.0.
# The sign-off trailer is the certification, so it is checked on every commit in
# the pull request, not just the tip.
name: DCO

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the PR's commits and their merge base, not just the tip.
          fetch-depth: 0

      - name: Every commit carries a matching Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          failed=0
          commits=$(git rev-list --no-merges "$BASE..$HEAD")

          if [ -z "$commits" ]; then
            echo "No non-merge commits to check."
            exit 0
          fi

          for sha in $commits; do
            author="$(git show -s --format='%an <%ae>' "$sha")"
            subject="$(git show -s --format='%s' "$sha")"
            # Parsed with git-interpret-trailers rather than a bare grep, so
            # "Signed-off-by" is recognised by git's own definition of a
            # trailer and not wherever the string happens to appear.
            if git interpret-trailers --parse <<<"$(git show -s --format='%B' "$sha")" \
                 | grep -qiF "Signed-off-by: $author"; then
              echo "  ok  ${sha:0:8}  $subject"
            else
              echo "::error::${sha:0:8} \"$subject\" has no Signed-off-by matching its author ($author)"
              git interpret-trailers --parse <<<"$(git show -s --format='%B' "$sha")" \
                | grep -i '^Signed-off-by:' | sed 's/^/          found: /' || true
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            cat <<'MSG'

          ────────────────────────────────────────────────────────────────
          Every commit needs a Signed-off-by trailer matching its author.

            last commit only:   git commit --amend -s --no-edit
            the whole branch:   git rebase --signoff ${{ github.event.pull_request.base.ref }}
            then:               git push --force-with-lease

            never again:        git config --global format.signoff true

          What you are certifying: DCO in the repository root.
          Why a DCO and not a CLA: CONTRIBUTING.md#sign-your-commits-dco
          ────────────────────────────────────────────────────────────────
          MSG
            exit 1
          fi

          echo
          echo "All $(echo "$commits" | wc -l | tr -d ' ') commit(s) signed off."
