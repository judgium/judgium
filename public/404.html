<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="error.notFound.title">Page not found</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
</head>
<body>
  <header class="topbar">
    <a class="topbar__brand" href="/"><img class="topbar__logo" src="/brand/icon-32.png" alt="" width="26" height="26" decoding="async"><span data-i18n="app.name">Judgium</span></a>
    <span class="topbar__spacer"></span>
    <div id="langpick"></div>
  </header>
  <main class="shell shell--narrow">
    <div class="card stack">
      <h1 data-i18n="error.notFound.title">Page not found</h1>
      <p class="muted" data-i18n="error.notFound.body"></p>
      <p><a href="/" data-i18n="error.home">Go to the home page</a></p>
    </div>
  </main>

  <footer class="footer footer--compact">
    <a class="footer__source" href="/source" rel="license" data-source-link data-i18n="app.source">Source code (AGPL-3.0)</a>
  </footer>
  <script type="module">
    import { initI18n } from '/js/i18n.js';
    import { mountLanguagePicker } from '/js/lang.js';
    await initI18n();
    mountLanguagePicker(document.getElementById('langpick'));
  </script>
</body>
</html>
