<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.name">Judgium</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png">
  <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
</head>
<body>
  <header class="topbar">
    <span class="topbar__brand"><img class="topbar__logo" src="/brand/icon-32.png" alt="" width="26" height="26" decoding="async"><span data-i18n="app.name">Judgium</span></span>
    <span class="topbar__spacer"></span>
    <span class="row row--nowrap" id="livestate"></span>
    <button class="btn btn--sm" id="fullscreen" data-i18n="action.fullscreen" type="button">Full screen</button>
    <div id="langpick"></div>
  </header>

  <main class="shell shell--wide" id="main">
    <p class="muted" id="boot" data-i18n="state.loading">Loading…</p>
  </main>

  <footer class="footer footer--compact">
    <a class="footer__source" href="/source" rel="license" data-source-link data-i18n="app.source">Source code (AGPL-3.0)</a>
  </footer>

  <script type="module" src="/js/board.js"></script>
</body>
</html>
